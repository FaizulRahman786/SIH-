<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillSaarthi AI</title>
    <meta name="description" content="SkillSaarthi AI — AI-Powered Competency and Workforce Intelligence Platform" />
    <!-- Anti-flash theme script: runs synchronously before paint -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('skillsaarthi_theme') || 'system';
          var dark = saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
